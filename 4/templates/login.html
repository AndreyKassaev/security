{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}
{% block container_class %}container-sm{% endblock %}

{% block content %}
    <h2>Авторизация</h2>
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="text" name="username" placeholder="Логин (например: user)" required>
        <input type="password" name="password" placeholder="Пароль (например: 123)" required>
        <button type="submit" class="btn-primary">Войти</button>
    </form>
    
    <p><small>Тестовые аккаунты: <b>user / 123</b> или <b>admin / password123</b></small></p>
{% endblock %}
